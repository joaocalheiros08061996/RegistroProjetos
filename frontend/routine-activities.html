<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atividades de Rotina | Registro</title>
  <link rel="stylesheet" href="styles.css?v=20260512">
</head>
<body>
<main class="page">
  <header class="page-header">
    <div class="routine-header-copy">
      <h1 class="title">Atividades de Rotina</h1>
      <label class="routine-responsavel-field" for="responsavel">
        Responsável
        <input id="responsavel" type="text" maxlength="120" placeholder="Informe o responsável pela atividade">
      </label>
      <p class="muted">Selecione o tipo de atividade, inicie e finalize quando concluir.</p>
    </div>
    <div class="actions">
      <a class="button secondary" href="module-select.html">Trocar módulo</a>
      <button class="danger" type="button" data-action="logout">Sair</button>
    </div>
  </header>

  <section class="section">
    <h2>Atividade atual</h2>
    <p id="status-label" class="status">Pronto para iniciar.</p>
    <div id="active-box" class="item active-box hidden">
      <p class="item-subtitle" id="active-label"></p>
    </div>
  </section>

  <section class="section">
    <h2>Tipo de atividade</h2>
    <p id="selected-label" class="status">Nenhuma atividade selecionada.</p>
    <div id="activity-types" class="routine-types"></div>
  </section>

  <section class="section">
    <h2>Descrição</h2>
    <label for="descricao">
      Detalhe opcional
      <textarea id="descricao" rows="3" maxlength="1000" placeholder="Descreva o que será feito"></textarea>
    </label>
  </section>

  <section class="section">
    <div class="actions">
      <button type="button" id="start-btn">Iniciar</button>
      <button type="button" class="secondary" id="finish-btn">Finalizar</button>
    </div>
    <p id="feedback" class="status"></p>
  </section>
</main>

<script src="app.js?v=20260602"></script>
<script src="pages/routine-activities.js?v=20260602"></script>
</body>
</html>
