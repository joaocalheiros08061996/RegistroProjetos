<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarefa | Registro de Projetos</title>
  <link rel="stylesheet" href="styles.css?v=20260410">
</head>
<body>
<main class="page">
  <header class="page-header">
    <div>
      <h1 class="title" id="task-title">Tarefa</h1>
      <p class="muted" id="task-subtitle">Carregando...</p>
    </div>
    <div class="actions">
      <a class="button secondary" id="back-link" href="projects.html">Voltar</a>
      <button class="secondary" type="button" id="refresh-btn">Atualizar</button>
    </div>
  </header>

  <section class="section">
    <h2>Controle da tarefa</h2>
    <div class="actions">
      <button type="button" id="start-btn">Iniciar</button>
      <button type="button" class="secondary" id="stop-btn">Parar</button>
      <button type="button" class="secondary" id="complete-btn">Concluir</button>
      <button type="button" class="danger" id="delete-btn">Excluir tarefa</button>
    </div>
    <p id="action-feedback" class="status"></p>
  </section>

  <section class="section">
    <h2>Detalhes</h2>
    <div id="task-details" class="grid cols-2"></div>
  </section>

  <section class="section">
    <h2>Entradas de tempo</h2>
    <div id="time-entries" class="list"></div>
  </section>
</main>

<script src="app.js?v=20260602"></script>
<script src="pages/task.js?v=20260609"></script>
</body>
</html>
