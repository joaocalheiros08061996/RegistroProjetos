<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projeto | Registro de Projetos</title>
  <link rel="stylesheet" href="styles.css?v=20260410">
</head>
<body>
<main class="page">
  <header class="page-header">
    <div>
      <h1 class="title" id="project-title">Projeto</h1>
      <p class="muted" id="project-subtitle">Carregando...</p>
    </div>
    <div class="actions">
      <a class="button secondary" href="projects.html">Voltar para projetos</a>
      <button class="secondary" type="button" id="refresh-btn">Atualizar</button>
      <button class="danger" type="button" id="delete-project-btn">Excluir projeto</button>
    </div>
  </header>

  <section class="section">
    <h2>Resumo</h2>
    <div id="project-metrics" class="grid cols-2"></div>
    <p id="project-feedback" class="status"></p>
  </section>

  <section class="section">
    <h2>Tarefas</h2>
    <p class="muted">Projetos com mais de 10 tarefas exibem nesta lista somente tarefas não concluídas.</p>
    <div id="task-list" class="list"></div>
  </section>

  <section class="section">
    <h2>Nova tarefa</h2>
    <form id="task-form" class="grid cols-2">
      <label for="task_name">
        Nome da tarefa
        <input id="task_name" maxlength="160" required>
      </label>

      <label for="task_cost">
        Custo
        <input id="task_cost" type="number" min="0" max="1000000000" step="0.01" value="0">
      </label>

      <label class="full-span" for="task_description">
        Descrição da tarefa
        <textarea id="task_description" rows="3" maxlength="150"></textarea>
      </label>

      <label for="task_planned_start">
        Início planejado
        <input id="task_planned_start" type="datetime-local" required>
      </label>

      <label for="task_planned_end">
        Fim planejado
        <input id="task_planned_end" type="datetime-local" required>
      </label>

      <div class="actions" style="align-self:end;">
        <button type="submit">Criar tarefa</button>
      </div>
    </form>
    <p id="task-form-feedback" class="status"></p>
  </section>
</main>

<script src="app.js?v=20260602"></script>
<script src="pages/project.js?v=20260609"></script>
</body>
</html>
