<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | Registro de Projetos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page">
  <header class="page-header">
    <div>
      <h1 class="title">Criar conta</h1>
      <p class="muted">Cadastro simples com email e senha.</p>
    </div>
  </header>

  <form id="register-form" class="grid">
    <label for="email">
      Email
      <input id="email" type="email" autocomplete="username" required>
    </label>

    <label for="password">
      Senha
      <input id="password" type="password" autocomplete="new-password" minlength="6" required>
    </label>

    <div class="actions">
      <button type="submit">Cadastrar</button>
      <a class="button secondary" href="login.html">Voltar para login</a>
    </div>

    <p id="feedback" class="status" role="status"></p>
  </form>
</main>

<script src="app.js"></script>
<script>
  requireGuest();

  const form = document.getElementById("register-form");
  const feedback = document.getElementById("feedback");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    feedback.textContent = "";
    feedback.className = "status";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      feedback.textContent = "Informe email e senha.";
      feedback.className = "error";
      return;
    }

    try {
      await signUp(email, password);
      feedback.textContent = "Conta criada com sucesso. Agora faca login.";
      feedback.className = "success";
      setTimeout(() => {
        location.href = "login.html";
      }, 900);
    } catch (err) {
      feedback.textContent = err.message || "Falha no cadastro.";
      feedback.className = "error";
    }
  });
</script>
</body>
</html>
