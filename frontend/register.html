<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | Registro de Projetos</title>
  <link rel="stylesheet" href="styles.css?v=20260603">
</head>
<body>
<main class="page">
  <header class="page-header">
    <div>
      <h1 class="title">Criar conta</h1>
      <p class="muted">Cadastre-se com e-mail, senha e ciência do aviso de privacidade.</p>
    </div>
  </header>

  <form id="register-form" class="grid">
    <label for="email">
      E-mail
      <input id="email" type="email" autocomplete="username" required>
    </label>

    <label for="password">
      Senha
      <input id="password" type="password" autocomplete="new-password" minlength="6" required>
    </label>

    <label class="checkbox-row" for="privacy-notice-acknowledged">
      <input id="privacy-notice-acknowledged" type="checkbox" required>
      <span>
        Li e estou ciente do
        <a href="privacy.html" target="_blank" rel="noopener noreferrer">Aviso de Privacidade</a>
        aplicável ao uso do Registro de Projetos.
      </span>
    </label>

    <div class="actions">
      <button type="submit">Cadastrar</button>
      <a class="button secondary" href="login.html">Voltar para login</a>
    </div>

    <p id="feedback" class="status" role="status"></p>
  </form>
</main>

<script src="app.js?v=20260603"></script>
<script src="pages/register.js?v=20260603"></script>
</body>
</html>
