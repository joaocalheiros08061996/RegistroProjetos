<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Registro de Projetos</title>
  <link rel="stylesheet" href="styles.css?v=20260410">
</head>
<body>
<main class="page">
  <header class="page-header">
    <div>
      <h1 class="title">Entrar</h1>
      <p class="muted">Use sua conta para acessar projetos e tarefas.</p>
    </div>
  </header>

  <form id="login-form" class="grid">
    <label for="email">
      E-mail
      <input id="email" type="email" autocomplete="username" required>
    </label>

    <label for="password">
      Senha
      <input id="password" type="password" autocomplete="current-password" required>
    </label>

    <div class="actions">
      <button type="submit">Entrar</button>
      <a class="button secondary" href="register.html">Criar conta</a>
    </div>

    <p id="feedback" class="error" role="alert"></p>
  </form>
</main>

<script src="app.js?v=20260602"></script>
<script src="pages/login.js?v=20260602"></script>
</body>
</html>
